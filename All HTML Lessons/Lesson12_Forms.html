<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- action attribute sends data to this (index.php) location in backend -->
     <!-- method attribute specifies if this is GET or POST request -->
      <!-- POST is used for confidential information like username password -->
       <!-- GET is for Insensitive data -->
        <!-- enctype is an attribute which is used when we send large amount of data through this form to backend
         and this attribute divide that large data into small parts and then send to backend in small part form
         and then backend re-assemble that data in organized form -->

    <form action="index.php" method="POST" enctype="multipart/form-data">
        <label for="username">UserName: </label>
        <input type="text" id="username" placeholder="Enter UserName" maxlength="20" required>

        <!-- for attribute of label tag should match the id attribute of button tag -->
        <br><br>

        <label for="password">password: </label>
        <input type="password" id="password" placeholder="Enter your password" minlength="8" required>

        <br><br>

        <label for="email">Email: </label>
        <input type="email" id="email" placeholder="mail@gmail.com">
        <br><br>
        <label for="phone">Phone: </label>
        <input type="tel" id="phone" placeholder="000-000-0000" pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}">
        <br><br>
        <label for="bday">Birthday: </label>
        <input type="date" id="bday">

        <br><br>

        <label for="quantity">Quantity:</label>
        <input type="number" id="quantity" min="0" max="99" value="1">

        <br><br>

        <label for="title">Title:</label>

        <label for="Mr.">Mr.:</label>
        <input type="radio" id="Mr." value="Mr." name="title">
        <label for="Ms.">Ms.: </label>
        <input type="radio" id="Ms." value="Ms." name="title">
        <label for="PhD.">PhD.: </label>
        <input type="radio" id="PhD." value="PhD." name="title">

        <br><br>

        <label for="mode">Your Mode: </label>

        <label for="happy">Happy</label>
        <input type="radio" id="happy" name="mode" value="happy">
        <label for="sad">Sad</label>
        <input type="radio" id="sad" name="mode" value="sad">
        <label for="neutral">Neutral</label>
        <input type="radio" id="neutral" name="mode" value="neutral">

        <br><br>
        <label for="payment">Payement</label>
        <select>
            <option value="visa">visa</option>
            <option value="mastercard">mastercard</option>
            <option value="gifcard">gifcard</option>
        </select>
        <br><br>
        <label for="program">Select Program</label>
        <select name="selectProgram" id="program">
            <option value="CS">Computer Science</option>
            <option value="AI">Artificial Intelligence</option>
            <option value="SE">Software Engineering</option>
            <option value="CS">Cyber Security</option>
        </select>

        <br><br>

        <label for="subscribe">Subsribe</label>
        <input type="checkbox" id="subscribe">
        <br><br>

        <label for="comment">Comment:</label>
        <textarea id="comment" rows="3" cols="40"></textarea>

        <br><br>
        <label for="file">Upload File:</label>
        <input type="file" id="file" accpet="image/png, image/jpg">

        <br><br>
        <input type="submit">
        <input type="reset">

    </form>
</body>
</html>
